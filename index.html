:root{
  color-scheme:dark;
  /* Kauçuk zemin — nötr grafit */
  --bg:#121314;--card:#1b1c1e;--card2:#25272a;--card3:#303336;
  --text:#eceeef;--text2:#a9adb2;--text3:#82878d;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.05);
  /* Yarışma plakası renkleri: kırmızı 25 · mavi 20 · yeşil 10 · beyaz 5 */
  --push:#e8523d;--pull:#4f88f2;--legs:#2fb872;--full:#e9e5d9;
  /* Sarı plaka: odak, bugün, güncel hafta */
  --accent:#f5bc1c;--accent-dim:rgba(245,188,28,.15);--accent-border:rgba(245,188,28,.5);
  --red:#ff5a5f;--red-dim:rgba(255,90,95,.14);--red-border:rgba(255,90,95,.38);
  --green:#34c27e;--green-dim:rgba(52,194,126,.15);--green-border:rgba(52,194,126,.42);
  /* eski adlar (JS içindeki satır içi stiller bunları kullanıyor) */
  --orange:var(--push);--orange-dim:rgba(232,82,61,.15);--orange-border:rgba(232,82,61,.4);
  --purple:var(--pull);
  --blue:var(--full);--blue-dim:rgba(233,229,217,.13);--blue-border:rgba(233,229,217,.35);
  /* vücut haritası */
  --mm-a:#2a2c2f;--mm-b:#232528;--mm-c:#1e2023;--mm-line:#3d4044;
  --display:'Big Shoulders Display Variable','Big Shoulders Display','Arial Narrow',sans-serif;
  --sans:'Instrument Sans Variable','Instrument Sans',-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  --radius:24px;
  --nav-h:68px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%;height:-webkit-fill-available;}
button,.day-sel-btn,.nav-btn,.set-input,.rpe-btn{touch-action:manipulation;}
body{
  display:flex;flex-direction:column;
  background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;
  overflow:hidden;
  height:100vh;height:100dvh;height:-webkit-fill-available;
}
button{font-family:var(--sans);}

/* ── plaka: tüm uygulamanın tek motifi ── */
.t-push{--c:var(--push);}
.t-pull{--c:var(--pull);}
.t-legs{--c:var(--legs);}
.t-full{--c:var(--full);}
.t-rest{--c:var(--text3);}
.plate{
  --s:16px;display:inline-block;flex:none;width:var(--s);height:var(--s);border-radius:50%;
  background:
    radial-gradient(circle closest-side,transparent 0 58%,rgba(0,0,0,.32) 59% 63%,transparent 64%),
    radial-gradient(circle at 30% 26%,rgba(255,255,255,.30),transparent 52%),
    var(--c,var(--text3));
  -webkit-mask:radial-gradient(circle closest-side,transparent 0 15%,#000 16%);
  mask:radial-gradient(circle closest-side,transparent 0 15%,#000 16%);
}
.plate.xl{
  background:
    radial-gradient(circle closest-side,transparent 0 31%,rgba(0,0,0,.24) 32% 34%,transparent 35% 71%,rgba(0,0,0,.24) 72% 74%,transparent 75% 88%,rgba(0,0,0,.20) 89% 92%,transparent 93%),
    radial-gradient(circle at 30% 24%,rgba(255,255,255,.26),transparent 55%),
    var(--c,var(--text3));
  -webkit-mask:radial-gradient(circle closest-side,transparent 0 12%,#000 13%);
  mask:radial-gradient(circle closest-side,transparent 0 12%,#000 13%);
}

/* ── alt menü: yüzen cam çubuk ── */
#nav{
  position:fixed;z-index:50;left:14px;right:14px;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 6px);
  display:flex;gap:2px;padding:6px;
  border-radius:32px;
  background:color-mix(in srgb,var(--card2) 70%,transparent);
  -webkit-backdrop-filter:blur(26px) saturate(1.7);backdrop-filter:blur(26px) saturate(1.7);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:8px 4px 7px;min-height:54px;min-width:44px;
  background:none;border:none;border-radius:26px;
  color:var(--text2);font-size:11px;font-weight:600;letter-spacing:.01em;
  cursor:pointer;transition:background .2s,color .2s;
}
.nav-btn.active{background:rgba(255,255,255,.11);color:var(--text);}
.nav-btn.active svg{stroke:var(--accent);}
.nav-btn svg{width:24px;height:24px;stroke-width:1.8;}

/* ── ekranlar ── */
#app{flex:1;overflow:hidden;position:relative;min-height:0;}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:none;
  padding-bottom:calc(env(safe-area-inset-bottom, 0px) + var(--nav-h) + 40px);
}
.screen.active{display:block;}

.screen-header{
  padding-top:calc(env(safe-area-inset-top, 0px) + 10px);padding-bottom:10px;
  padding-left:calc(env(safe-area-inset-left, 0px) + 18px);padding-right:calc(env(safe-area-inset-right, 0px) + 14px);
  display:flex;align-items:center;justify-content:space-between;min-height:calc(env(safe-area-inset-top, 0px) + 64px);
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--bg) 80%,transparent);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
}
.screen-title{font-family:var(--display);font-weight:800;font-size:42px;line-height:1;letter-spacing:.01em;color:var(--text);}


/* ── odak modu ── */
.focus-bar{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 64px);z-index:15;display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:8px 14px 10px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);}
.fb-main{flex:1;min-width:0;}
.fb-text{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
.fb-text b{color:var(--text);font-weight:700;font-size:15px;}
.fb-track{height:5px;border-radius:3px;background:var(--card3);overflow:hidden;}
.fb-track i{display:block;height:100%;width:0;background:var(--c,var(--accent));border-radius:3px;transition:width .3s ease;}
.fb-btn{flex:none;min-width:36px;height:36px;padding:0 8px;border-radius:18px;background:transparent;border:1px solid transparent;color:var(--text3);display:inline-flex;align-items:center;justify-content:center;gap:5px;font-family:var(--sans);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;}
.fb-btn:active{background:var(--card2);}
.fb-btn.on{color:var(--text);}
.fb-btn.run{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent);}
.fb-btn.fin{background:var(--green-dim);border-color:var(--green-border);color:var(--green);}
.exercise-card{scroll-margin-top:calc(env(safe-area-inset-top, 0px) + 64px + 64px);}
.exercise-card.active{border-color:color-mix(in srgb,var(--c,var(--accent)) 60%,transparent);}
.ex-count{flex:none;font-family:var(--display);font-weight:700;font-size:20px;color:var(--text3);font-variant-numeric:tabular-nums;padding:0 4px;}
.ex-count.full{color:var(--green);display:inline-flex;align-items:center;}
.exercise-card.collapsed .exercise-header{padding:11px 12px 11px 6px;cursor:pointer;}
.exercise-card.collapsed .exercise-name{font-size:19px;color:var(--text2);}
.exercise-card.collapsed.alldone .exercise-name{color:var(--text3);}
.exercise-card.collapsed .prev-banner,.exercise-card.collapsed .exercise-note-wrap,.exercise-card.collapsed .set-header,.exercise-card.collapsed .sets-container,.exercise-card.collapsed .add-set-row,.exercise-card.collapsed .pr-badge,.exercise-card.collapsed .note-btn{display:none !important;}
.exercise-card.collapsed.card-pr,.exercise-card.collapsed.card-drop{border-left-width:1px;border-left-color:var(--border);}
.set-chk{flex:none;width:46px;height:54px;border-radius:16px;background:var(--card2);border:1.5px solid var(--border);color:var(--text3);opacity:.9;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,border-color .12s;}
.set-chk:active{transform:scale(.94);}
.set-row.done .set-chk{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#121314;opacity:1;}
.set-row.done .set-input,.set-row.done .rpe-btn{background:color-mix(in srgb,var(--c,var(--accent)) 12%,var(--card2));}
.set-row .set-del-btn{min-width:26px;}
.set-col-label{font-size:13px;color:var(--text2);}
.col-del{min-width:26px;}.col-chk{min-width:46px;}
.set-header,.sets-container .set-row{gap:6px;}


/* ── program düzenleme ── */
.alt-row{display:flex;gap:4px;margin:0 14px 10px;padding:4px;background:var(--card2);border-radius:16px;}
.alt-chip{flex:1;min-height:40px;border:none;background:transparent;color:var(--text2);font-family:var(--sans);font-size:13.5px;font-weight:600;border-radius:12px;cursor:pointer;padding:6px 8px;line-height:1.2;}
.alt-chip.on{background:var(--c,var(--accent));color:#121314;}
.exercise-card.collapsed .alt-row{display:none !important;}
.orph{font-size:12px;color:var(--text3);margin-top:3px;}
.editor{position:fixed;inset:0;z-index:150;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top, 0px) + 10px) 14px calc(env(safe-area-inset-bottom, 0px) + 40px);}
.editor.hidden{display:none;}
.ed-head{display:flex;align-items:center;gap:12px;padding:6px 0 16px;}
.ed-title{font-family:var(--display);font-weight:800;font-size:36px;line-height:1;}
.ed-sub{font-size:13px;color:var(--text2);margin-top:4px;}
.ed-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:8px 10px 8px 6px;margin-bottom:8px;}
.ed-mv{display:flex;flex-direction:column;gap:2px;}
.ed-mv button{width:36px;height:30px;background:none;border:none;color:var(--text2);display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer;}
.ed-mv button:disabled{opacity:.22;}
.ed-mv button:active{background:var(--card2);}
.ed-main{flex:1;min-width:0;padding:4px 2px;cursor:pointer;}
.ed-name{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1;}
.ed-meta{font-size:12.5px;color:var(--text2);margin-top:3px;}
.ed-add{width:100%;margin-top:8px;min-height:52px;}
.fld{margin-bottom:12px;}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:6px;}
.fld .modal-input{margin-bottom:0;}
.fld small{display:block;font-size:12px;color:var(--text3);margin-top:5px;line-height:1.4;}
.fld-row{display:flex;gap:10px;}.fld-row .fld{flex:1;min-width:0;}
.chk{display:flex;align-items:flex-start;gap:12px;font-size:14px;color:var(--text);margin:8px 0 12px;line-height:1.35;}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin-top:1px;}
.chk small{display:block;color:var(--text3);font-size:12px;margin-top:2px;}
.xrow{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
.xrow .modal-input{margin-bottom:0;flex:1;}

/* ── butonlar ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;min-height:44px;border-radius:16px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .12s;-webkit-touch-callout:none;}
.btn:active{opacity:.8;transform:scale(.97);}
.btn svg{flex:none;}
.btn-primary{background:var(--text);color:var(--bg);}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid var(--red-border);}
.btn-orange{background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-border);}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:14px;min-height:40px;}
.btn-icon{width:40px;height:40px;border-radius:50%;background:var(--card2);border:1px solid var(--border);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.btn-icon:active{background:var(--card3);}

/* ── gün seçici ── */
.day-selector{display:grid;grid-template-columns:repeat(30,1fr);gap:8px;padding:6px 14px 2px;width:100%;}
.day-sel-btn{
  grid-column:span 6;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  min-height:64px;padding:10px 2px 9px;border-radius:20px;
  border:1px solid var(--border);background:var(--card);color:var(--text2);
  font-size:13px;font-weight:600;line-height:1;cursor:pointer;
  transition:background .2s,border-color .2s,color .2s,transform .12s;
}
.day-sel-btn .plate{--s:20px;}
.day-sel-btn:nth-child(n+6){grid-column:span 10;flex-direction:row;gap:10px;min-height:52px;}
.day-sel-btn:nth-child(n+6) .plate{--s:18px;}
.day-sel-btn:active{transform:scale(.96);}
.day-sel-btn.on{background:color-mix(in srgb,var(--c,var(--text3)) 15%,var(--card));border-color:color-mix(in srgb,var(--c,var(--text3)) 70%,transparent);color:var(--text);}

.date-nav{display:flex;align-items:center;gap:6px;}
.date-nav-label{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;min-width:52px;text-align:center;}

/* ── günün başlığı ── */
.day-header{
  position:relative;overflow:hidden;
  margin:14px 14px 12px;padding:18px 18px 16px;min-height:168px;
  background:var(--card);border-radius:28px;border:1px solid color-mix(in srgb,var(--c,var(--text3)) 34%,var(--border));
}
.day-plate{position:absolute;right:-52px;top:50%;--s:184px;margin-top:-92px;pointer-events:none;}
.day-date{font-size:13px;color:var(--text2);margin-bottom:8px;position:relative;}
.day-name{font-family:var(--display);font-weight:800;font-size:50px;line-height:.92;letter-spacing:.005em;color:var(--text);max-width:74%;text-transform:uppercase;position:relative;}
.day-desc{font-size:13.5px;line-height:1.4;color:var(--text2);margin-top:10px;max-width:58%;position:relative;}
.day-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative;}
@keyframes plateRoll{from{transform:translateX(150px) rotate(220deg);opacity:0;}55%{opacity:1;}to{transform:none;opacity:1;}}
.day-plate.roll{animation:plateRoll .8s cubic-bezier(.18,.85,.25,1) both;}
@media (prefers-reduced-motion:reduce){.day-plate.roll{animation:none;}}

.done-note{margin:0 14px 12px;padding:12px 16px;display:flex;align-items:center;gap:10px;background:var(--green-dim);border:1px solid var(--green-border);border-radius:18px;font-size:13px;color:var(--green);font-weight:600;line-height:1.35;}

/* ── geçen seans özeti ── */
.prev-banner{margin:0 14px 8px;padding:9px 12px;display:flex;gap:8px;align-items:flex-start;background:var(--card2);border-radius:14px;font-size:12.5px;color:var(--text2);line-height:1.45;}
.prev-banner svg{flex:none;margin-top:2px;color:var(--text3);}
.prev-banner strong{color:var(--text);font-weight:600;}

/* ── hareket kartı ── */
.exercise-card{margin:0 14px 12px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);transition:opacity .15s,transform .1s,border-color .1s;}
.exercise-card.dragging{opacity:.4;border-color:var(--accent-border);background:var(--card2);}
.exercise-card.drag-over{border-color:var(--accent);transform:translateY(-2px);}
.exercise-header{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 6px;gap:8px;}
.exercise-name{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.04;letter-spacing:.01em;color:var(--text);}
.exercise-hdr-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.drag-handle{display:flex;align-items:center;justify-content:center;padding:10px 6px;color:var(--text3);cursor:grab;flex-shrink:0;touch-action:none;-webkit-user-select:none;user-select:none;}
.drag-handle:active{color:var(--accent);}
.drag-handle svg{pointer-events:none;}

.exercise-note-wrap{padding:0 14px 10px;}
.exercise-note{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:11px 13px;color:var(--text2);font-family:var(--sans);font-size:14px;resize:none;outline:none;line-height:1.5;}
.exercise-note:focus{border-color:var(--accent-border);color:var(--text);}
.exercise-note::placeholder{color:var(--text3);}
.note-inherited{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);padding:0 2px 6px;}

/* ── set tablosu ── */
.set-header{display:flex;align-items:center;gap:8px;padding:0 14px 6px;}
.set-header-num{min-width:24px;}
.set-col-label{font-size:12px;font-weight:600;color:var(--text3);text-align:center;}
.col-kg{flex:2.2;}.col-reps{flex:1.5;}.col-rpe{flex:1.5;}.col-del{min-width:36px;}
.sets-container{padding:0 14px 8px;}
.set-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.set-row:has(.delta-up,.delta-down){margin-bottom:18px;}
.set-num{font-family:var(--display);font-weight:700;font-size:22px;color:var(--text3);min-width:24px;text-align:center;flex-shrink:0;}
.ds-badge{font-size:10px;font-weight:800;color:#1a1400;background:var(--accent);border-radius:7px;padding:3px 0;flex-shrink:0;min-width:24px;text-align:center;}
.set-input-wrap{flex:1;position:relative;}
.set-input,.rpe-btn{
  width:100%;height:54px;padding:0 4px;background:var(--card2);border:1.5px solid var(--border);border-radius:16px;
  color:var(--text);font-family:var(--display);font-weight:700;font-size:30px;line-height:1;text-align:center;
  font-variant-numeric:tabular-nums;outline:none;-webkit-appearance:none;appearance:none;caret-color:var(--accent);
  transition:border-color .15s,background .15s;
}
.set-input:focus{border-color:var(--accent);background:var(--card3);}
.set-ghost-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:30px;color:var(--text3);pointer-events:none;opacity:.55;}
.set-del-btn{min-width:36px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--text3);cursor:pointer;flex-shrink:0;}
.set-del-btn:active{color:var(--red);}
.rpe-btn{cursor:pointer;}
.rpe-btn.empty{color:var(--text3);}
.rpe-btn:active{border-color:var(--accent-border);}
.add-set-row{display:flex;gap:8px;padding:2px 14px 14px;}
.add-set-row .btn{flex:1;font-size:13px;padding:10px 8px;}

.delta-up{color:var(--green);font-size:11px;font-weight:700;}
.delta-down{color:var(--red);font-size:11px;font-weight:700;}
.set-input.pr{border-color:var(--green-border) !important;background:var(--green-dim) !important;color:var(--green) !important;}
.set-input.drop{border-color:var(--red-border) !important;background:var(--red-dim) !important;}
.exercise-card.card-pr{border-left:3px solid var(--green);}
.exercise-card.card-drop{border-left:3px solid var(--red);}
.pr-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;flex-shrink:0;}
.pr-badge.up{background:var(--green-dim);color:var(--green);border:1px solid var(--green-border);}
.pr-badge.down{background:var(--red-dim);color:var(--red);border:1px solid var(--red-border);}

/* ── bitir düğmesi ── */
.complete-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 28px);margin:6px 14px 0;min-height:62px;padding:14px;background:var(--text);border:none;border-radius:24px;font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:.04em;text-transform:uppercase;color:var(--bg);cursor:pointer;transition:transform .12s,opacity .15s;}
.complete-btn:active{opacity:.85;transform:scale(.98);}
.complete-btn.done{background:var(--green-dim);color:var(--green);border:1.5px solid var(--green-border);}

/* ── etiketler ── */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px 4px 8px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--text3)) 15%,transparent);color:var(--c,var(--text3));}
.tag-push{--c:var(--push);}.tag-pull{--c:var(--pull);}.tag-legs{--c:var(--legs);}.tag-full{--c:var(--full);}.tag-rest{--c:var(--text3);}

/* ── takvim ── */
.cal-month-nav{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 12px;}
.cal-month-title{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.01em;}
.cal-stats{margin:0 14px 14px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:16px 8px 14px;}
.stat-row{display:flex;justify-content:space-around;}
.stat-item{text-align:center;min-width:52px;}
.stat-val{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;color:var(--text);font-variant-numeric:tabular-nums;}
.stat-item.t-push .stat-val{color:var(--push);}
.stat-item.t-pull .stat-val{color:var(--pull);}
.stat-item.t-legs .stat-val{color:var(--legs);}
.stat-item.t-full .stat-val{color:var(--full);}
.stat-label{display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;color:var(--text2);margin-top:6px;font-weight:500;}
.stat-label .plate{--s:9px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 14px 14px;}
.cal-dow{text-align:center;font-size:12px;font-weight:600;color:var(--text3);padding:6px 0;}
.cal-day{aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;font-size:14px;font-weight:600;color:var(--text3);cursor:pointer;background:transparent;border:1.5px solid transparent;gap:4px;transition:background .15s;}
.cal-day:active{opacity:.7;}
.cal-day.today{border-color:var(--accent);color:var(--accent);}
.cal-day.has-w{background:var(--card);}
.cal-day.has-w .cal-dn{color:var(--text);}
.cal-day.today .cal-dn,.cal-day.today.has-w .cal-dn{color:var(--accent);}
.cal-day.empty{opacity:0;pointer-events:none;}
.cal-dn{font-size:14px;font-weight:600;}
.cal-log-item{margin:0 14px 8px;background:var(--card);border-radius:20px;border:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;}
.cal-log-item:active{background:var(--card2);}
.log-info{flex:1;}
.log-date{font-size:12.5px;color:var(--text2);}
.log-name{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.01em;margin-top:1px;display:flex;align-items:center;gap:6px;}

/* ── gelişim ── */
.prog-filter{display:flex;gap:8px;padding:2px 14px 12px;overflow-x:auto;scrollbar-width:none;}
.prog-filter::-webkit-scrollbar{display:none;}
.prog-filter-btn{flex-shrink:0;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;}
.prog-filter-btn.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.prog-tabs{display:flex;gap:2px;margin:0 14px 14px;background:var(--card);border-radius:18px;padding:4px;border:1px solid var(--border);}
.prog-tab{flex:1;min-height:40px;padding:0 4px;border-radius:14px;border:none;background:none;color:var(--text3);font-size:13.5px;font-weight:600;cursor:pointer;transition:background .15s,color .15s;}
.prog-tab.active{background:var(--card3);color:var(--text);}
.prog-ex-card{margin:0 14px 12px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:16px 16px 14px;}
.prog-ex-name{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.05;color:var(--text);}
.vol-summary{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
.vol-chart-wrap{display:flex;align-items:flex-end;justify-content:flex-start;gap:6px;margin-bottom:8px;padding:24px 2px 0;}
.vol-bar-col{flex:1;max-width:46px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;}
.vol-bar{width:100%;border-radius:7px 7px 3px 3px;min-height:4px;transition:height .4s ease;}
.vol-bar.past{background:rgba(255,255,255,.13);}
.vol-bar.cur{background:var(--accent);}
.vol-bar-lbl{font-size:10px;color:var(--text3);white-space:nowrap;}
.vol-top-val{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--accent);white-space:nowrap;}
.prog-delta-badge{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;flex-shrink:0;}
.prog-delta-badge.up{background:var(--green-dim);color:var(--green);}
.prog-delta-badge.down{background:var(--red-dim);color:var(--red);}
.prog-delta-badge.eq{background:var(--card2);color:var(--text3);}
.prog-history-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border2);}
.prog-history-row:last-child{border-bottom:none;}
.prog-sec-title{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.01em;color:var(--text);padding:12px 18px 8px;display:flex;align-items:center;gap:8px;}

/* ── ayarlar ── */
.set-section{margin:0 14px 14px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;min-height:58px;border-bottom:1px solid var(--border2);}
.set-row:last-child{border-bottom:none;}
.set-label{font-size:15px;font-weight:600;color:var(--text);}
.set-sub{font-size:12.5px;color:var(--text2);margin-top:2px;}
.set-sec-title{font-size:13px;font-weight:600;color:var(--text2);padding:18px 20px 8px;}

/* ── alt sayfa (modal) ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
.modal-overlay.hidden{display:none;}
.modal{background:var(--card);border-radius:32px 32px 0 0;border:1px solid var(--border);border-bottom:none;padding:12px 18px calc(22px + env(safe-area-inset-bottom, 0px));width:100%;max-width:520px;max-height:88vh;overflow-y:auto;}
.modal-handle{width:42px;height:5px;background:rgba(255,255,255,.2);border-radius:3px;margin:0 auto 18px;}
.modal-title{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.01em;margin-bottom:14px;}
.modal-input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:16px;padding:14px 16px;color:var(--text);font-family:var(--sans);font-size:16px;outline:none;margin-bottom:10px;}
.modal-input:focus{border-color:var(--accent-border);}
.modal-btns{display:flex;gap:8px;margin-top:12px;}
.modal-btns .btn{flex:1;padding:14px;}

.rpe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px;}
.rpe-option{display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:18px;border:1.5px solid var(--border);background:var(--card2);color:var(--text);font-family:var(--display);font-weight:700;font-size:28px;text-align:center;cursor:pointer;transition:background .1s,border-color .1s;}
.rpe-option:active,.rpe-option.sel{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-border);}
.rpe-clear{width:100%;min-height:46px;border-radius:16px;background:var(--card2);border:1px solid var(--border);color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;}

#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom, 0px) + var(--nav-h) + 22px);left:50%;transform:translateX(-50%) translateY(14px);background:color-mix(in srgb,var(--card3) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:999px;padding:12px 22px;font-size:14px;font-weight:600;z-index:999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.4);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── boş durumlar ── */
::-webkit-scrollbar{width:0;}
.empty-state{text-align:center;padding:64px 24px;color:var(--text2);}
.empty-icon{display:flex;justify-content:center;margin-bottom:16px;color:var(--text3);}
.empty-text{font-size:15px;line-height:1.55;}
.empty-title{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:.01em;color:var(--text);margin-bottom:6px;}
.empty-plates{display:flex;justify-content:center;gap:8px;margin-bottom:18px;}
.empty-plates .plate{--s:30px;}

/* ── vücut haritası ── */
.muscle-map-wrap{margin:0 14px 16px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:16px;}
.muscle-map-title{font-family:var(--display);font-weight:700;font-size:22px;color:var(--text);margin-bottom:4px;}
.muscle-map-sub{font-size:12.5px;color:var(--text3);margin-bottom:14px;}
.muscle-map-views{display:flex;gap:12px;justify-content:center;}
.muscle-map-views svg{flex:1;max-width:180px;}
.muscle-map-views svg [fill="#242436"]{fill:var(--mm-a);}
.muscle-map-views svg [fill="#1E1E2E"]{fill:var(--mm-b);}
.muscle-map-views svg [fill="#1A1A2E"]{fill:var(--mm-c);}
.muscle-map-views svg [stroke="#3A3A5C"]{stroke:var(--mm-line);}
.muscle-map-views svg [fill="#5A5A78"]{fill:var(--text3);}
.muscle-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:center;}
.muscle-legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text2);}
.muscle-legend-dot{width:12px;height:12px;border-radius:4px;flex-shrink:0;}
.muscle-week-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px;}
.muscle-week-label{font-size:14px;font-weight:600;color:var(--text);}
.muscle-detail{margin-top:16px;display:flex;flex-direction:column;gap:8px;}
.muscle-detail-row{display:flex;align-items:center;gap:10px;}
.muscle-detail-name{font-size:13px;color:var(--text2);min-width:112px;}
.muscle-detail-bar-bg{flex:1;background:var(--card2);border-radius:5px;height:8px;overflow:hidden;}
.muscle-detail-bar{height:100%;border-radius:5px;transition:width .4s ease;}
.muscle-detail-val{font-size:12px;font-weight:700;min-width:54px;text-align:right;color:var(--text);font-variant-numeric:tabular-nums;}

details summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:36px;color:var(--text2);font-size:13px;font-weight:600;}
details summary::-webkit-details-marker{display:none;}
details[open] summary{color:var(--text);}

/* ── geçen seans: doldur düğmesi ve artış ipucu ── */
.prev-body{flex:1;min-width:0;}
.prev-hint{color:var(--accent);font-weight:600;margin-top:4px;}
.prev-fill{flex:none;align-self:center;min-height:40px;padding:0 14px;border-radius:14px;border:1px solid var(--border);background:var(--card3);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.prev-fill:active{transform:scale(.96);}
.prev-fill.up{background:var(--accent-dim);border-color:var(--accent-border);color:var(--accent);}
/* ── haftalık özet ── */
.week-strip{display:flex;align-items:center;gap:14px;margin:12px 14px 0;padding:11px 16px;background:var(--card);border:1px solid var(--border);border-radius:20px;}
.week-plates{display:flex;gap:6px;flex:none;}
.week-plates .plate{--s:24px;}
.plate.empty{background:none;-webkit-mask:none;mask:none;border:2px dashed rgba(255,255,255,.24);}
.ws-main{font-size:14.5px;font-weight:600;color:var(--text);}
.ws-sub{font-size:12.5px;color:var(--text2);margin-top:2px;line-height:1.35;}
.ws-sub .up{color:var(--green);font-weight:600;}.ws-sub .down{color:var(--red);font-weight:600;}
.stepper{display:flex;align-items:center;gap:10px;}
.stepper .btn-icon{font-size:22px;line-height:1;font-weight:500;}
.stepper-val{font-family:var(--display);font-weight:800;font-size:28px;min-width:22px;text-align:center;}
/* ── rekorlar ── */
.rec-note{font-size:12.5px;color:var(--text3);padding:0 20px 10px;}
.rec-card{margin:0 14px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.rec-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border2);}
.rec-row:last-child{border-bottom:none;}
.rec-main{flex:1;min-width:0;}
.rec-name{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.05;}
.rec-sub{font-size:12.5px;color:var(--text2);margin-top:3px;}
.rec-right{text-align:right;flex:none;}
.rec-val{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;}
.rec-val small{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--text3);margin-left:3px;}
.rec-new{display:inline-block;font-size:11px;font-weight:700;color:var(--green);background:var(--green-dim);border-radius:999px;padding:2px 8px;margin-bottom:4px;}
</style>

// ═══════════════════════════════════════════════

// ═══════════════════════════════════════════════

      {id:'leg_press',         name:'Leg Press',                          defSets:3, defReps:11, repHi:12, opts:[{id:'leg_press',name:'Leg Press'},{id:'bulgarian_split_squat',name:'Bulgarian Split Squat'}]},

let PROGRAM = JSON.parse(JSON.stringify(PROGRAM_DEFAULT));
function initProgram() {
  const ok = Array.isArray(db.program) && db.program.length === PROGRAM_DEFAULT.length;
  PROGRAM = JSON.parse(JSON.stringify(ok ? db.program : PROGRAM_DEFAULT));
  if (ok) db.program = PROGRAM; else delete db.program;
  syncExNames();
}
// Hareket adı/kas kaydı: programdan çıkarılan hareketlerin geçmişi de adıyla görünsün
function syncExNames() {
  if (!db.exNames) db.exNames = {};
  PROGRAM.forEach(p => p.exercises.forEach(ex => (ex.opts || [ex]).forEach(o => { db.exNames[o.id] = o.name; })));
}
function exName(id) { return (db.exNames && db.exNames[id]) || id; }
function flatEx(prog) {
  return prog.exercises.flatMap(ex => ex.opts
    ? ex.opts.map(o => Object.assign({}, ex, { id: o.id, name: o.name, opts: undefined, slotId: ex.id }))
    : [ex]);
}
function hasData(arr) { return !!arr && arr.some(r => (r.kg !== '' && r.kg !== undefined) || r.done); }
// Seçenekli hareket (slot): seansta hangi seçenek yapıldıysa onun kimliği kullanılır
function resolveEx(ex, w) {
  if (!ex.opts) return Object.assign({}, ex, { slotId: ex.id });
  const chosen = (w.alt && w.alt[ex.id]) || null;
  const o = ex.opts.find(x => x.id === chosen) || ex.opts.find(x => hasData(w.sets[x.id])) || ex.opts[0];
  return Object.assign({}, ex, { id: o.id, name: o.name, slotId: ex.id });
}
function sessionExercises(prog, w) {
  let list = prog.exercises.map(ex => resolveEx(ex, w));
  if (w.completed) list = list.filter(e => w.sets[e.id] || (w.alt && w.alt[e.slotId]));
  const used = new Set(list.map(e => e.id));
  const orphans = [];
  Object.keys(w.sets || {}).forEach(id => {
    if (!used.has(id) && hasData(w.sets[id])) orphans.push({ id, slotId: id, name: exName(id), defSets: w.sets[id].length, defReps: '', orphan: true });
  });
  if (w.exOrder && list.every(e => w.exOrder.includes(e.slotId))) {
    const pos = e => { const k = w.exOrder.indexOf(e.slotId); return k < 0 ? 1e6 : k; };
    list = list.map((e, i) => [e, i]).sort((a, b) => pos(a[0]) - pos(b[0]) || a[1] - b[1]).map(x => x[0]);
  }
  return list.concat(orphans);
}
function pickAlt(d, slot, optId) {
  flushPending();
  const w = db.workouts[d]; if (!w) return;
  const prog = PROGRAM[w.dayIdx]; const sx = prog && prog.exercises.find(e => e.id === slot); if (!sx) return;
  const cur = resolveEx(sx, w).id; if (cur === optId) return;
  const old = w.sets[cur];
  const targetHas = hasData(w.sets[optId]);
  if (hasData(old) && !targetHas) {
    if (!confirm(`Bu seanstaki girdiler "${exName(optId)}" hareketine taşınsın mı?`)) return;
  }
  if (!targetHas) {
    if (hasData(old) || w.completed) {
      w.sets[optId] = old;
      if (w.notes && w.notes[cur] !== undefined) { w.notes[optId] = w.notes[cur]; delete w.notes[cur]; }
    }
    delete w.sets[cur];
  }
  if (!w.alt) w.alt = {};
  w.alt[slot] = optId;
  if (window._activeEx === cur) window._activeEx = optId;
  saveDB(); renderToday();
}
const RPE_VALUES = [10, 9.5, 9, 8.5, 8, 7.5, 7, 6.5, 6];

// ═══════════════════════════════════════════════
// DB
// ═══════════════════════════════════════════════
let db = { workouts: {} };

function loadDB() {
  try { const s = localStorage.getItem('gt_v4'); if (s) db = JSON.parse(s); } catch(e) {}
  normalizeDB();
}
function normalizeDB() {
  if (!db.workouts) db.workouts = {};
  // Tek seferlik: set onayı eklenmeden önceki kayıtlarda kg girilmiş setleri 'yapıldı' say
  if (!db.settings) db.settings = {};
  if (!db.settings.doneMig) {
    Object.values(db.workouts).forEach(w => {
      Object.values(w.sets || {}).forEach(arr => (arr || []).forEach(x => {
        if (x && x.done === undefined && x.kg !== '' && x.kg !== undefined) x.done = true;
      }));
    });
    db.settings.doneMig = 1;
    saveDB();
  }
  initProgram();
}
function saveDB() {
  try { localStorage.setItem('gt_v4', JSON.stringify(db)); } catch(e) {}
}

// ═══════════════════════════════════════════════
// DATE UTILS
// ═══════════════════════════════════════════════
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function pad(n) { return String(n).padStart(2,'0'); }
function dateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate()+n); return dateStr(d); }
function fmtShort(s) {
  const d = parseDate(s);
  return `${ ['Pz','Pt','Sa','Ça','Pe','Cu','Ct'][d.getDay()] } ${d.getDate()}/${d.getMonth()+1}`;
}
function fmtLong(s) {
  const d = parseDate(s);
  const days = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  const months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

// ═══════════════════════════════════════════════
// NAV
// ═══════════════════════════════════════════════
function goScreen(name, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
  if (btn) btn.classList.add('active');
  else { const b = document.querySelector(`.nav-btn[data-screen="${name}"]`); if (b) b.classList.add('active'); }
  if (name === 'today') renderWeekStrip();
  if (name === 'calendar') renderCalendar();
  if (name === 'progress') renderProgress();
  if (name === 'settings') renderSettings();
}

// ═══════════════════════════════════════════════
// TODAY
// ═══════════════════════════════════════════════
let viewDate = todayStr();
let selectedProgIdx = null; // null = seçilmedi

function shiftDate(n) {
  viewDate = addDays(viewDate, n);
  // O güne kaydedilmiş program varsa yükle, yoksa null
  const w = db.workouts[viewDate];
  selectedProgIdx = (w && w.dayIdx !== undefined && PROGRAM[w.dayIdx]) ? w.dayIdx : null;
  window._plateRoll = true;
  renderToday();
}

function renderDaySelector() {
  const row = document.getElementById('daySelectorRow');
  // Kısa etiketler — iPhone 11'de 5 buton yan yana sığsın
  const shortNames = {
    push_a: 'Push A',
    pull_a: 'Pull A',
    legs:   'Legs',
    push_b: 'Push B',
    pull_b: 'Pull B',
    full_a: 'Full Body A',
    full_b: 'Full Body B',
    full_c: 'Full Body C',
  };
  row.innerHTML = PROGRAM.map((p, i) => {
    const active = selectedProgIdx === i;
    const cls = `day-sel-btn t-${p.type}${active ? ' on' : ''}`;
    const label = shortNames[p.id] || p.name;
    return `<button class="${cls}" onclick="pickProg(${i})"><i class="plate"></i><span>${label}</span></button>`;
  }).join('');
}

function pickProg(idx) {
  const w = db.workouts[viewDate];

  // Tamamlanmış antrenmanı değiştirme
  if (w && w.completed) {
    showToast('Antrenman kilitli — önce kilidi aç');
    return;
  }

  // Farklı programla veri varsa onay al
  if (w && w.dayIdx !== idx) {
    const hasData = Object.values(w.sets || {}).some(sets =>
      sets.some(s => s.kg !== '' && s.kg !== undefined)
    );
    if (hasData) {
      if (!confirm(`Bu güne ait ${PROGRAM[w.dayIdx]?.name} verisi var. ${PROGRAM[idx].name} ile değiştirirsen mevcut veriler silinecek. Devam et?`)) {
        return;
      }
      // Onayladı — veriyi temizle
      w.sets = {};
      w.exOrder = null;
      w.alt = {};
    }
  }

  selectedProgIdx = idx;
  window._plateRoll = true;
  renderToday();
}

function renderToday() {
  flushPending();
  const isToday = viewDate === todayStr();
  document.getElementById('dateNavLabel').textContent = isToday ? 'Bugün' : fmtShort(viewDate);

  // Kaydedilmiş günün programını yükle
  if (selectedProgIdx === null) {
    const w = db.workouts[viewDate];
    if (w && w.dayIdx !== undefined && PROGRAM[w.dayIdx]) {
      selectedProgIdx = w.dayIdx;
    }
  }

  renderDaySelector();
  renderWeekStrip();

  const content = document.getElementById('todayContent');

  if (selectedProgIdx === null) {
    content.innerHTML = `
    <div class="empty-state">
      <div class="empty-plates"><i class="plate t-push"></i><i class="plate t-pull"></i><i class="plate t-legs"></i><i class="plate t-full"></i></div>
      <div class="empty-title">Antrenman seç</div>
      <div class="empty-text">Yukarıdan bugün yapacağın<br>antrenmanı seç.</div>
    </div>`;
    return;
  }

  const prog = PROGRAM[selectedProgIdx];

  // Workout kaydını oluştur veya yükle
  if (!db.workouts[viewDate]) {
    db.workouts[viewDate] = { dayIdx: selectedProgIdx, sets: {}, notes: {}, completed: false };
  }
  const w = db.workouts[viewDate];

  // dayIdx güncelle ama veriyi ASLA silme — pickProg zaten onay aldı
  w.dayIdx = selectedProgIdx;
  if (!w.notes) w.notes = {};

  // Set şablonlarını hazırla — sadece henüz girilmemiş hareketler için
  if (!w.completed) sessionExercises(prog, w).forEach(ex => {
    if (!w.sets[ex.id]) {
      const prev = getPrevSets(ex.id, viewDate);
      if (prev && prev.length > 0) {
        // Geçen seansın kg'ları kayda yazılmaz, yalnızca silik (hayalet) gösterilir.
        // Böylece sadece açıp çıktığın gün gelişim geçmişine sahte seans olarak girmez.
        w.sets[ex.id] = prev.map(s => ({ kg: '', reps: s.reps, rpe: '', isDS: !!s.isDS }));
      } else {
        const rows = Array.from({ length: ex.defSets }, () => ({ kg: '', reps: ex.defReps, rpe: '', isDS: false }));
        if (ex.defDropSet) rows.push({ kg: '', reps: ex.defReps, rpe: '', isDS: true });
        w.sets[ex.id] = rows;
      }
    }
  });
  saveDB();

  const orderedExercises = sessionExercises(prog, w);

  const done = w.completed;
  const roll = !!window._plateRoll; window._plateRoll = false;

  // Tamamlanmış antrenman — kilitle
  let html = `
  <div class="day-header t-${prog.type}">
    <i class="plate xl day-plate${roll ? ' roll' : ''}"></i>
    <div class="day-date">${fmtLong(viewDate)}</div>
    <div class="day-name">${prog.name}</div>
    <div class="day-desc">${prog.desc}</div>
    <div class="day-actions">
      ${done
        ? `<button class="btn btn-ghost btn-sm" onclick="unlockWorkout('${viewDate}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>Kilidi aç</button>`
        : `<button class="btn btn-danger btn-sm" onclick="confirmDeleteWorkout('${viewDate}')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>Günü sil</button>`
      }
    </div>
  </div>
  ${done ? `<div class="done-note"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg><span>Antrenman tamamlandı ve kilitlendi. Düzenlemek için kilidi aç.</span></div>` : ''}
  ${done ? '' : focusBarHtml(orderedExercises, w)}
  <div id="exListContainer" class="t-${prog.type}">`;

  const focus = !done && focusOn();
  const activeId = focus ? getActiveEx(orderedExercises, w) : null;
  orderedExercises.forEach(ex => { html += renderExCard(ex, viewDate, w, done, focus, activeId); });
  html += `</div>`;

  html += `<button class="complete-btn ${done ? 'done' : ''}" onclick="toggleComplete('${viewDate}')">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>${done ? 'Tamamlandı' : 'Antrenman tamam'}
  </button><div style="height:28px;"></div>`;

  const scr = content.closest('.screen');
  const st = scr ? scr.scrollTop : 0;
  content.innerHTML = html;
  if (scr) scr.scrollTop = st;
  initDragDrop();
  updateRestUI();
}

function renderExCard(ex, dateS, w, locked = false, focus = false, activeId = null) {
  const sets = w.sets[ex.id] || [];
  const nDone = sets.filter(x => x.done).length;
  const collapsed = focus && ex.id !== activeId;
  const allDone = sets.length > 0 && nDone === sets.length;
  const prevSets = getPrevSets(ex.id, dateS);
  const prevDate = getPrevDate(ex.id, dateS);

  // Ghost banner — önceki seans özeti
  let ghostHtml = '';
  if (prevSets && prevDate) {
    const summary = prevSets.filter(s => s.kg !== '' && s.kg !== undefined)
      .map(s => `${s.kg}kg×${s.reps}`).join(', ');
    if (summary) {
      const sug = suggestIncrease(ex, prevSets);
      const canFill = !locked && sets.some(s => s.kg === '' || s.kg === undefined);
      const fillBtn = canFill
        ? `<button class="prev-fill${sug ? ' up' : ''}" onclick="fillFromPrev('${dateS}','${ex.id}',${sug ? sug.inc : 0})">${sug ? '+' + String(sug.inc).replace('.', ',') + ' kg ile al' : 'Aynen al'}</button>`
        : '';
      const hint = sug ? `<div class="prev-hint">Tüm setlerde ${sug.hi} tekrara ulaştın. Bu sefer +${String(sug.inc).replace('.', ',')} kg dene.</div>` : '';
      ghostHtml = `<div class="prev-banner"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/><polyline points="12 7 12 12 15 14"/></svg><div class="prev-body"><div><strong>${fmtShort(prevDate)}</strong> · ${summary}</div>${hint}</div>${fillBtn}</div>`;
    }
  }

  // Not: bugünkü yoksa önceki göster
  const todayNote = (w.notes && w.notes[ex.id]) || '';
  const prevNote = !todayNote ? getPrevNote(ex.id, dateS) : '';
  const noteValue = todayNote || prevNote;
  const noteIsInherited = !todayNote && !!prevNote;

  const setHeaderHtml = `
  <div class="set-header">
    <div class="set-header-num"></div>
    <div class="set-col-label col-kg">kg</div>
    <div class="set-col-label col-reps">tekrar</div>
    <div class="set-col-label col-rpe">RPE</div>
    ${locked ? '' : '<div class="col-chk"></div>'}
    <div class="col-del"></div>
  </div>`;

  let setsHtml = '';
  let cardPrState = null; // 'up' | 'down' | null

  // Kart seviyesi: toplam hacim karşılaştırması
  // Set onayı kullanıldıysa yalnızca işaretli setler sayılır; geçen seansla aynı sıradaki setler kıyaslanır
  const useDone = sets.some(x => x.done) && sets.some(x => !x.done);
  const vol = s => (parseFloat(s.kg)||0)*(parseFloat(s.reps)||0);
  const prevVol = prevSets
    ? (useDone
        ? sets.reduce((a,s,i) => a + (s.done && prevSets[i] ? vol(prevSets[i]) : 0), 0)
        : prevSets.reduce((a,s) => a + vol(s), 0))
    : 0;
  const curVol = sets.reduce((a,s) => a + (!useDone || s.done ? vol(s) : 0), 0);
  if (prevVol > 0 && curVol > 0) {
    cardPrState = curVol > prevVol ? 'up' : curVol < prevVol ? 'down' : null;
  }

  // Epley 1RM tahmini: kg × (1 + reps/30)
  function epley(kg, reps) {
    const k = parseFloat(kg), r = parseFloat(reps);
    if (!k || !r || r <= 0) return 0;
    return k * (1 + r / 30);
  }

  sets.forEach((set, i) => {
    const prevS = prevSets ? prevSets[i] : null;
    const ghostKg  = (prevS && prevS.kg !== '' && set.kg === '') ? prevS.kg : '';
    const ghostRps = (prevS && prevS.reps !== '' && (set.reps === '' || set.reps === undefined)) ? prevS.reps : '';

    // Set bazında: 1RM karşılaştırması
    let delta = '';
    let kgClass = '';
    const cur1RM  = epley(set.kg, set.reps);
    const prev1RM = prevS ? epley(prevS.kg, prevS.reps) : 0;

    if (cur1RM > 0 && prev1RM > 0) {
      const diff = cur1RM - prev1RM;
      const sign = diff > 0 ? '+' : '';
      if (diff > 0) {
        delta = `<span class="delta-up">▲ 1RM +${diff.toFixed(1)}</span>`;
        kgClass = 'pr';
      } else if (diff < 0) {
        delta = `<span class="delta-down">▼ 1RM ${diff.toFixed(1)}</span>`;
        kgClass = 'drop';
      }
    }

    const numLabel = set.isDS
      ? `<span class="ds-badge">DS</span>`
      : `<span class="set-num">${i+1}</span>`;

    const dis = locked ? 'disabled style="opacity:.5;pointer-events:none"' : '';

    setsHtml += `
    <div class="set-row${set.done ? ' done' : ''}" id="sr_${dateS}_${ex.id}_${i}">
      ${numLabel}
      <div class="set-input-wrap col-kg">
        <input class="set-input${kgClass ? ' '+kgClass : ''}" type="number" inputmode="decimal"
          value="${set.kg}" placeholder="" ${dis}
          data-d="${dateS}" data-e="${ex.id}" data-i="${i}" data-f="kg"
          oninput="onInput(this)" onfocus="onFocus(this)">
        ${ghostKg ? `<div class="set-ghost-val">${ghostKg}</div>` : ''}
        ${delta ? `<div style="position:absolute;bottom:-13px;left:0;right:0;text-align:center;font-size:10px;">${delta}</div>` : ''}
      </div>
      <div class="set-input-wrap col-reps">
        <input class="set-input" type="number" inputmode="numeric"
          value="${set.reps}" placeholder="" ${dis}
          data-d="${dateS}" data-e="${ex.id}" data-i="${i}" data-f="reps"
          oninput="onInput(this)" onfocus="onFocus(this)">
        ${ghostRps ? `<div class="set-ghost-val">${ghostRps}</div>` : ''}
      </div>
      <div class="set-input-wrap col-rpe">
        <button class="rpe-btn${set.rpe === '' ? ' empty' : ''}" ${dis}
          onclick="openRpePicker('${dateS}','${ex.id}',${i})">${set.rpe !== '' ? set.rpe : '—'}</button>
      </div>
      ${locked ? '' : `<button class="set-chk" aria-label="Seti işaretle" onclick="toggleSetDone('${dateS}','${ex.id}',${i})"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>`}
      <button class="set-del-btn" ${dis} onclick="deleteSet('${dateS}','${ex.id}',${i})">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>`;
  });

  // Kart seviyesi rozet — hacim farkı % olarak
  const cardClass = cardPrState === 'up' ? 'card-pr' : cardPrState === 'down' ? 'card-drop' : '';
  let prBadge = '';
  if (prevVol > 0 && curVol > 0) {
    const pct = ((curVol - prevVol) / prevVol * 100);
    const sign = pct > 0 ? '+' : '';
    if (pct > 0)      prBadge = `<span class="pr-badge up">▲ ${sign}${pct.toFixed(0)}% hacim</span>`;
    else if (pct < 0) prBadge = `<span class="pr-badge down">▼ ${pct.toFixed(0)}% hacim</span>`;
  }

  const altHtml = ex.opts ? '' : '';
  const slotEx = (PROGRAM[w.dayIdx] && PROGRAM[w.dayIdx].exercises.find(x => x.id === ex.slotId)) || null;
  const altRow = slotEx && slotEx.opts
    ? `<div class="alt-row">${slotEx.opts.map(o => `<button class="alt-chip${o.id === ex.id ? ' on' : ''}" onclick="pickAlt('${dateS}','${ex.slotId}','${o.id}')">${o.name}</button>`).join('')}</div>`
    : '';
  return `
  <div class="exercise-card ${cardClass}${collapsed ? ' collapsed' : ''}${focus && !collapsed ? ' active' : ''}${collapsed && allDone ? ' alldone' : ''}" id="exc_${ex.id}" data-exid="${ex.id}" data-slot="${ex.slotId || ex.id}">
    <div class="exercise-header" onclick="hdrTap(event,'${ex.id}')">
      <div class="drag-handle" title="Sırayı değiştir">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9"  cy="5"  r="1" fill="currentColor"/>
          <circle cx="9"  cy="12" r="1" fill="currentColor"/>
          <circle cx="9"  cy="19" r="1" fill="currentColor"/>
          <circle cx="15" cy="5"  r="1" fill="currentColor"/>
          <circle cx="15" cy="12" r="1" fill="currentColor"/>
          <circle cx="15" cy="19" r="1" fill="currentColor"/>
        </svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div class="exercise-name">${ex.name}</div>${ex.orphan ? '<div class="orph">Programda yok · kayıtların duruyor</div>' : ''}
      </div>
      <div class="exercise-hdr-actions">
        ${prBadge}
        ${collapsed ? (allDone ? '<span class="ex-count full"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>' : `<span class="ex-count">${nDone}/${sets.length}</span>`) : ''}
        <button class="btn-icon note-btn" onclick="toggleNote('${ex.id}')" title="Not">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
            stroke="${noteValue ? 'var(--accent)' : 'currentColor'}" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </button>
      </div>
    </div>
    ${altRow}
    ${ghostHtml}
    <div class="exercise-note-wrap" id="nw_${ex.id}" style="${noteValue ? '' : 'display:none'}">
      ${noteIsInherited ? `<div class="note-inherited"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 7 3 3H7l3-3z"/></svg>Önceki antrenmandan</div>` : ''}
      <textarea class="exercise-note" rows="2" placeholder="Sonraki antrenman için not..."
        data-d="${dateS}" data-e="${ex.id}"
        oninput="onNoteInput(this)">${noteValue}</textarea>
    </div>
    ${setHeaderHtml}
    <div class="sets-container" id="sets_${dateS}_${ex.id}" style="padding-bottom:${sets.some((_,i)=>{ const p=prevSets?prevSets[i]:null; return p&&sets[i]&&sets[i].kg!==''&&p.kg!==''; })?'20px':'8px'}">${setsHtml}</div>
    ${locked ? '' : `<div class="add-set-row">
      <button class="btn btn-ghost" onclick="addSet('${dateS}','${ex.id}',false)">+ Set ekle</button>
      <button class="btn btn-orange" onclick="addSet('${dateS}','${ex.id}',true)">+ Drop set</button>
    </div>`}
  </div>`;
}

function moveEx(i, d) {
  const a = PROGRAM[edDay].exercises, j = i + d;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]];
  commitProgram(); renderDayEditor();
}
function openExEditor(idx) {
  const ex = idx >= 0 ? PROGRAM[edDay].exercises[idx] : null;
  ed = {
    idx, name: ex ? ex.name : '',
    extras: ex && ex.opts ? ex.opts.slice(1).map(o => ({ id: o.id, name: o.name })) : [],

    drop: !!(ex && ex.defDropSet), muscle: ex ? (muscleOf(ex.id) || 'none') : 'none', diff: false

  ed.drop = g('edDrop').checked; ed.muscle = g('edMuscle').value;
  ed.diff = g('edDiff') ? g('edDiff').checked : false;
}
function knownNames() {

}

// Dinlenme sayacı: zaman damgasıyla çalışır, ekran kapanıp açılınca şaşmaz
const rest = { end: 0, iv: null, fin: 0, ctx: null };
function getRestSec() { const v = db.settings && parseInt(db.settings.restSec); return v >= 15 && v <= 600 ? v : 90; }
function startRest() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { rest.ctx = rest.ctx || new AC(); if (rest.ctx.state === 'suspended') rest.ctx.resume(); }
  } catch (e) {}
  rest.end = Date.now() + getRestSec() * 1000; rest.fin = 0;
  clearInterval(rest.iv); rest.iv = setInterval(restTick, 250);
  updateRestUI();
}
function stopRest() { clearInterval(rest.iv); rest.iv = null; rest.end = 0; rest.fin = 0; updateRestUI(); }
function restTap() { if (rest.end || rest.fin) stopRest(); else startRest(); }
function restTick() {
  if (rest.end && Date.now() >= rest.end) {
    clearInterval(rest.iv); rest.iv = null; rest.end = 0; rest.fin = Date.now();
    beep(); try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
    setTimeout(() => { if (rest.fin && Date.now() - rest.fin >= 7900) stopRest(); }, 8000);
  }
  updateRestUI();
}
function beep() {
  try {
    const c = rest.ctx; if (!c) return;
    [0, 0.22].forEach(t => {
      const o = c.createOscillator(), g = c.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(c.destination);
      const now = c.currentTime + t;
      g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.25, now + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
      o.start(now); o.stop(now + 0.2);
    });
  } catch (e) {}
}
function updateRestUI() {
  const b = document.getElementById('restBtn'), t = document.getElementById('restTxt');
  if (!b || !t) return;
  if (rest.end) {
    const left = Math.max(0, Math.ceil((rest.end - Date.now()) / 1000));
    t.textContent = Math.floor(left / 60) + ':' + pad(left % 60);
    b.className = 'fb-btn run';
  } else if (rest.fin) { t.textContent = 'Hazır'; b.className = 'fb-btn fin'; }
  else { t.textContent = ''; b.className = 'fb-btn'; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && (rest.end || rest.fin)) restTick(); });
function setRestSec(n) {
  if (!db.settings) db.settings = {};
  db.settings.restSec = Math.min(300, Math.max(30, getRestSec() + n)); saveDB(); renderSettings();
}
function toggleRestAuto() {
  if (!db.settings) db.settings = {};
  db.settings.restAuto = !db.settings.restAuto; saveDB(); renderSettings();
}
function fmtRestSec(n) { return Math.floor(n / 60) + ':' + pad(n % 60); }

// INPUT — 500ms debounce, blur iptal etmez
// ═══════════════════════════════════════════════
const _timers = {};
const _pend = {};   // henüz kaydedilmemiş girdiler
function flushPending() {
  Object.keys(_timers).forEach(k => clearTimeout(_timers[k]));
  Object.keys(_pend).forEach(k => { const fn = _pend[k]; delete _pend[k]; fn(); });
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushPending(); });
window.addEventListener('pagehide', flushPending);

function onInput(el) {
  const ghost = el.parentElement.querySelector('.set-ghost-val');
  if (ghost) ghost.style.opacity = el.value ? '0' : '0.5';

  // KG veya reps değişince anlık 1RM renklendirmesi
  if (el.dataset.f === 'kg' || el.dataset.f === 'reps') {
    const d = el.dataset.d, e = el.dataset.e, i = +el.dataset.i;
    const row = db.workouts[d]?.sets[e]?.[i];
    const prevSetsRow = getPrevSets(e, d);
    const prevS = prevSetsRow ? prevSetsRow[i] : null;

    // Anlık değerleri oku (henüz commit olmadı, DOM'dan al)
    const setRow = document.getElementById(`sr_${d}_${e}_${i}`);
    const kgEl   = setRow?.querySelector('[data-f="kg"]');
    const rpsEl  = setRow?.querySelector('[data-f="reps"]');
    const curKg  = kgEl  ? parseFloat(kgEl.value)  : 0;
    const curRps = rpsEl ? parseFloat(rpsEl.value) : 0;

    const cur1RM  = (curKg > 0 && curRps > 0) ? curKg * (1 + curRps / 30) : 0;
    const prev1RM = prevS ? (parseFloat(prevS.kg)||0) * (1 + (parseFloat(prevS.reps)||0) / 30) : 0;

    if (kgEl) {
      kgEl.classList.remove('pr', 'drop');
      if (cur1RM > 0 && prev1RM > 0) {
        if (cur1RM > prev1RM) kgEl.classList.add('pr');
        else if (cur1RM < prev1RM) kgEl.classList.add('drop');
      }
    }
  }

  const k = `${el.dataset.d}_${el.dataset.e}_${el.dataset.i}_${el.dataset.f}`;
  clearTimeout(_timers[k]);
  _pend[k] = () => commitSet(el.dataset.d, el.dataset.e, +el.dataset.i, el.dataset.f, el.value);
  _timers[k] = setTimeout(() => { const fn = _pend[k]; delete _pend[k]; if (fn) fn(); }, 500);
}

  const ghost = el.parentElement.querySelector('.set-ghost-val');

// ═══════════════════════════════════════════════
// DRAG & DROP — iOS Safari touch uyumlu
// ═══════════════════════════════════════════════
function initDragDrop() {
  const container = document.getElementById('exListContainer');
  if (!container) return;

  const getCards = () => [...container.querySelectorAll('.exercise-card')];
  let dragged = null;

  function saveOrder() {
    const w = db.workouts[viewDate]; if (!w) return;
    w.exOrder = getCards().map(c => c.dataset.slot || c.dataset.exid);
    saveDB();
  }

  function getCardAt(y) {
    return getCards().find(c => {
      if (c === dragged) return false;
      const r = c.getBoundingClientRect();
      return y >= r.top && y <= r.bottom;
    });
  }

  function insertAt(targetY) {
    const over = getCardAt(targetY);
    if (!over) return;
    getCards().forEach(c => c.classList.remove('drag-over'));
    over.classList.add('drag-over');
    const r = over.getBoundingClientRect();
    if (targetY < r.top + r.height / 2) container.insertBefore(dragged, over);
    else container.insertBefore(dragged, over.nextSibling);
  }

  // Touch
  container.addEventListener('touchstart', e => {
    const handle = e.target.closest('.drag-handle');
    if (!handle) return;
    dragged = handle.closest('.exercise-card');
    if (!dragged) return;
    e.preventDefault();
    dragged.classList.add('dragging');
  }, { passive: false });

  container.addEventListener('touchmove', e => {
    if (!dragged) return;
    e.preventDefault();
    insertAt(e.touches[0].clientY);
  }, { passive: false });

  container.addEventListener('touchend', () => {
    if (!dragged) return;
    dragged.classList.remove('dragging');
    getCards().forEach(c => c.classList.remove('drag-over'));
    saveOrder();
    dragged = null;
    showToast('Sıra kaydedildi');
  });

  // Mouse (desktop)
  container.addEventListener('mousedown', e => {
    const handle = e.target.closest('.drag-handle');
    if (!handle) return;
    dragged = handle.closest('.exercise-card');
    if (!dragged) return;
    dragged.classList.add('dragging');
  });

  document.addEventListener('mousemove', e => {
    if (!dragged) return;
    insertAt(e.clientY);
  });

  document.addEventListener('mouseup', () => {
    if (!dragged) return;
    dragged.classList.remove('dragging');
    getCards().forEach(c => c.classList.remove('drag-over'));
    saveOrder();
    dragged = null;
  });
}

// PREV SESSION HELPERS
// ═══════════════════════════════════════════════
function getPrevSets(exId, currentDate) {
  const keys = Object.keys(db.workouts).filter(d => d < currentDate).sort().reverse();
  for (const k of keys) {
    const s = db.workouts[k]?.sets?.[exId];
    if (s && s.some(r => r.kg !== '' && r.kg !== undefined)) return s;
  }
  return null;
}

// Çift artış kuralı: son seansta tüm çalışma setleri tekrar aralığının üst sınırına ulaştıysa
// (ve zorlanma kaydı 9'un altındaysa) bir sonraki seans için ağırlık artışı öner.
function suggestIncrease(ex, prevSets) {
  const hi = ex && ex.repHi;
  if (!hi || !prevSets) return null;
  const work = prevSets.filter(s => !s.isDS && parseFloat(s.kg) > 0 && parseFloat(s.reps) > 0);
  if (!work.length) return null;
  if (!work.every(s => parseFloat(s.reps) >= hi)) return null;
  if (work.some(s => parseFloat(s.rpe) >= 9)) return null;
  return { inc: 2.5, hi };
}

function fillFromPrev(d, e, inc) {
  flushPending();
  const w = db.workouts[d]; if (!w || w.completed || !w.sets[e]) return;
  const prev = getPrevSets(e, d); if (!prev) return;
  const fmt = n => String(Math.round(n * 100) / 100);
  w.sets[e].forEach((s, i) => {
    if (s.kg !== '' && s.kg !== undefined) return;       // yazdığın değere dokunma
    const p = prev[Math.min(i, prev.length - 1)];
    const kg = parseFloat(p && p.kg); if (!kg) return;
    s.kg = fmt(kg + (inc || 0));
  });
  saveDB(); renderToday();
  showToast(inc ? `+${String(inc).replace('.', ',')} kg ile dolduruldu` : 'Geçen seans dolduruldu');
}

function getPrevDate(exId, currentDate) {
  const keys = Object.keys(db.workouts).filter(d => d < currentDate).sort().reverse();
  for (const k of keys) {
    const s = db.workouts[k]?.sets?.[exId];
    if (s && s.some(r => r.kg !== '' && r.kg !== undefined)) return k;
  }
  return null;
}

function getPrevNote(exId, currentDate) {
  const keys = Object.keys(db.workouts).filter(d => d < currentDate).sort().reverse();
  for (const k of keys) {
    const note = db.workouts[k]?.notes?.[exId];
    if (note && note.trim()) return note;
  }
  return null;
}

  return g >= 1 && g <= 7 ? g : 3;
}
function setGoal(n) {
  if (!db.settings) db.settings = {};
  db.settings.weeklyGoal = Math.min(7, Math.max(1, getGoal() + n));
  saveDB(); renderSettings(); renderWeekStrip();
}
function weekSessions(offset) {
  const t = parseDate(todayStr());
  const mon = new Date(t); mon.setDate(t.getDate() - ((t.getDay() + 6) % 7) + offset * 7);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const a = dateStr(mon), b = dateStr(sun);
  return Object.keys(db.workouts).filter(d => d >= a && d <= b && db.workouts[d].completed).sort().map(d => {
    const w = db.workouts[d];
    const vol = Object.values(w.sets || {}).reduce((acc, arr) => acc + arr.reduce((x, r) => x + (parseFloat(r.kg) || 0) * (parseFloat(r.reps) || 0), 0), 0);
    return { date: d, type: (PROGRAM[w.dayIdx] || {}).type || 'rest', vol };
  });
}
function renderWeekStrip() {
  const el = document.getElementById('weekStrip'); if (!el) return;
  const cur = weekSessions(0), prev = weekSessions(-1), goal = getGoal();
  let plates = '';
  for (let i = 0; i < Math.max(goal, cur.length); i++)
    plates += i < cur.length ? `<i class="plate t-${cur[i].type}"></i>` : `<i class="plate empty"></i>`;
  const main = cur.length >= goal ? `Haftalık hedef tamam · ${cur.length}/${goal}` : `Bu hafta ${cur.length}/${goal} seans`;
  let sub = `Hedef: haftada ${goal} antrenman`;
  if (cur.length) {
    const avg = a => a.reduce((x, y) => x + y.vol, 0) / a.length;
    if (prev.length && avg(prev) > 0) {
      const pct = Math.round((avg(cur) / avg(prev) - 1) * 100);
      sub = pct === 0 ? 'Hacim geçen haftayla aynı'
        : `Geçen haftaya göre hacim <span class="${pct > 0 ? 'up' : 'down'}">%${Math.abs(pct)} ${pct > 0 ? 'yüksek' : 'düşük'}</span>`;
    } else {
      sub = `Toplam hacim ${(cur.reduce((x, y) => x + y.vol, 0) / 1000).toLocaleString('tr-TR', { maximumFractionDigits: 1 })} ton`;
    }
  }
  el.innerHTML = `<div class="week-strip"><div class="week-plates">${plates}</div><div class="week-text"><div class="ws-main">${main}</div><div class="ws-sub">${sub}</div></div></div>`;
}
