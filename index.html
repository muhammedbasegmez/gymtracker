// CALENDAR
// ═══════════════════════════════════════════════
let calY = new Date().getFullYear(), calM = new Date().getMonth();

function renderCalendar() {
  const today = todayStr();
  const months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const daysInMonth = new Date(calY, calM+1, 0).getDate();
  const startDow = (new Date(calY, calM, 1).getDay() + 6) % 7;

  // Tamamlanan antrenmanlar (sadece gerçek veri olanlara bak)
  const completed = Object.keys(db.workouts).filter(d => {
    const w = db.workouts[d];
    const dt = parseDate(d);
    return dt.getFullYear() === calY && dt.getMonth() === calM && w.completed;
  });
  const pushC = completed.filter(d => PROGRAM[db.workouts[d].dayIdx]?.type === 'push').length;
  const pullC = completed.filter(d => PROGRAM[db.workouts[d].dayIdx]?.type === 'pull').length;
  const legsC = completed.filter(d => PROGRAM[db.workouts[d].dayIdx]?.type === 'legs').length;
  const fullC = completed.filter(d => PROGRAM[db.workouts[d].dayIdx]?.type === 'full').length;

  let html = `
  <div class="cal-month-nav">
    <button class="btn-icon" onclick="calNav(-1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></button>
    <span class="cal-month-title">${months[calM]} ${calY}</span>
    <button class="btn-icon" onclick="calNav(1)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>
  <div class="cal-stats"><div class="stat-row">
    <div class="stat-item"><div class="stat-val">${completed.length}</div><div class="stat-label">Toplam</div></div>
    <div class="stat-item t-push"><div class="stat-val">${pushC}</div><div class="stat-label"><i class="plate"></i>Push</div></div>
    <div class="stat-item t-pull"><div class="stat-val">${pullC}</div><div class="stat-label"><i class="plate"></i>Pull</div></div>
    <div class="stat-item t-legs"><div class="stat-val">${legsC}</div><div class="stat-label"><i class="plate"></i>Legs</div></div>
    <div class="stat-item t-full"><div class="stat-val">${fullC}</div><div class="stat-label"><i class="plate"></i>Full</div></div>
  </div></div>
  <div class="cal-grid">
    <div class="cal-dow">Pt</div><div class="cal-dow">Sa</div><div class="cal-dow">Ça</div>
    <div class="cal-dow">Pe</div><div class="cal-dow">Cu</div><div class="cal-dow">Ct</div><div class="cal-dow">Pz</div>`;

  for (let i = 0; i < startDow; i++) html += `<div class="cal-day empty"></div>`;

  for (let day = 1; day <= daysInMonth; day++) {
    const ds = `${calY}-${pad(calM+1)}-${pad(day)}`;
    const w = db.workouts[ds];
    const isT = ds === today;
    const prog = w ? PROGRAM[w.dayIdx] : null;
    const hasRealData = w && Object.values(w.sets || {}).some(sets =>
      sets.some(s => s.kg !== '' && s.kg !== undefined)
    );
    let dot = '', hasCls = '';
    if (w && w.completed && prog) {
      hasCls = 'has-w';
      const colors = { push:'var(--orange)', pull:'var(--purple)', legs:'var(--green)' };
      dot = `<i class="plate t-${prog.type}" style="--s:11px"></i>`;
    } else if (hasRealData && prog) {
      hasCls = 'has-w';
      dot = `<i class="plate t-rest" style="--s:11px"></i>`;
    }
    html += `<div class="cal-day ${isT ? 'today' : ''} ${hasCls}" onclick="calDayGo('${ds}')">
      <span class="cal-dn">${day}</span>${dot}
    </div>`;
  }
  html += `</div>`;

  // Son antrenmanlar — gerçek verisi olanları göster
  const logs = Object.keys(db.workouts)
    .filter(d => {
      const w = db.workouts[d];
      return w.completed || Object.values(w.sets||{}).some(s=>s.some(r=>r.kg!==''&&r.kg!==undefined));
    })
    .sort().reverse().slice(0, 12);

  if (logs.length) {
    html += `<div class="prog-sec-title">Son antrenmanlar</div>`;
    logs.forEach(ds => {
      const w = db.workouts[ds];
      const prog = PROGRAM[w.dayIdx] || { name: '?', type: 'rest' };
      const colors = { push:'var(--orange)', pull:'var(--purple)', legs:'var(--green)', rest:'var(--text3)' };
      html += `<div class="cal-log-item" onclick="calDayGo('${ds}')">
        <i class="plate t-${prog.type}" style="--s:26px"></i>
        <div class="log-info">
          <div class="log-date">${fmtLong(ds)}</div>
          <div class="log-name">${prog.name} ${w.completed ? '✓' : ''}</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>`;
    });
  }

  document.getElementById('calendarContent').innerHTML = html;
}

function calNav(n) {
  calM += n;
  if (calM > 11) { calM = 0; calY++; }
  if (calM < 0) { calM = 11; calY--; }
  renderCalendar();
}

function calDayGo(ds) {
  viewDate = ds;
  const w = db.workouts[ds];
  selectedProgIdx = (w && w.dayIdx !== undefined && PROGRAM[w.dayIdx]) ? w.dayIdx : null;
  goScreen('today', null);
  renderToday();
}

// ═══════════════════════════════════════════════
// PROGRESS
// ═══════════════════════════════════════════════
let progFilter = 'all';
let progTab = 'volume';

function renderProgress() {
  const content = document.getElementById('progressContent');

  const exHistory = {};
  Object.keys(db.workouts).sort().forEach(ds => {
    const w = db.workouts[ds]; if (!w.sets) return;
    Object.keys(w.sets).forEach(exId => {
      const valid = w.sets[exId].filter(s => s.kg !== '' && s.kg !== undefined && s.reps !== '' && s.reps !== undefined);
      if (!valid.length) return;
      const maxKg = Math.max(...valid.map(s => parseFloat(s.kg) || 0));
      const totalVol = valid.reduce((a, s) => a + (parseFloat(s.kg)||0) * (parseFloat(s.reps)||0), 0);
      if (!exHistory[exId]) exHistory[exId] = [];
      exHistory[exId].push({ date: ds, maxKg, totalVol, sets: w.sets[exId] });
    });
  });

  if (!Object.keys(exHistory).length) {
    content.innerHTML = `<div class="empty-state"><div class="empty-icon"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"/><polyline points="15 6 21 6 21 12"/></svg></div><div class="empty-text">Henüz veri yok.<br>İlk antrenmanını kaydet, gelişimin burada görünsün.</div></div>`;
    return;
  }

  const filters = [{id:'all',label:'Tümü'},{id:'push',label:'Push'},{id:'pull',label:'Pull'},{id:'legs',label:'Legs'},{id:'full',label:'Full Body'}];
  let html = `
  <div class="prog-filter">${filters.map(f =>
    `<button class="prog-filter-btn${progFilter===f.id?' active':''}" onclick="setProgFilter('${f.id}')">${f.label}</button>`
  ).join('')}</div>
  <div class="prog-tabs">
    <button class="prog-tab${progTab==='muscle'?' active':''}" onclick="setProgTab('muscle')">Harita</button>
    <button class="prog-tab${progTab==='volume'?' active':''}" onclick="setProgTab('volume')">Hacim</button>
    <button class="prog-tab${progTab==='maxkg'?' active':''}" onclick="setProgTab('maxkg')">Max Kilo</button>
    <button class="prog-tab${progTab==='records'?' active':''}" onclick="setProgTab('records')">Rekorlar</button>
  </div>`;

  // Vücut haritası sekmesi
  if (progTab === 'muscle') {
    content.innerHTML = html + renderMuscleMap();
    return;
  }

  if (progTab === 'records') {
    content.innerHTML = html + renderRecords(exHistory);
    return;
  }

  const seenEx = new Set();
  const groups = PROGRAM.filter(p => p.type !== 'rest').map(p => ({ name: p.name, type: p.type, list: flatEx(p) }));
  PROGRAM.forEach(p => flatEx(p).forEach(e => seenEx.add('_' + e.id)));
  if (progFilter === 'all') {
    const extra = Object.keys(exHistory).filter(id => !seenEx.has('_' + id)).map(id => ({ id, name: exName(id) }));
    if (extra.length) groups.push({ name: 'Programda olmayanlar', type: 'rest', list: extra });
  }
  seenEx.clear();
  groups.forEach(prog => {
    if (progFilter !== 'all' && prog.type !== progFilter) return;
    const exs = prog.list.filter(ex => {
      if (seenEx.has(ex.id)) return false;
      seenEx.add(ex.id);
      return !!exHistory[ex.id];
    });
    if (!exs.length) return;

    html += `<div class="prog-sec-title t-${prog.type}"><i class="plate" style="--s:20px"></i>${prog.name}</div>`;

    exs.forEach(ex => {
      const hist = exHistory[ex.id];
      const useVol = progTab === 'volume';
      const last8 = hist.slice(-8);
      const vals = last8.map(h => useVol ? h.totalVol : h.maxKg);
      const maxVal = Math.max(...vals, 1);

      const latest = last8[last8.length - 1];
      const prev2  = last8.length > 1 ? last8[last8.length - 2] : null;
      let deltaBadge = '';
      if (prev2) {
        const latV = useVol ? latest.totalVol : latest.maxKg;
        const preV = useVol ? prev2.totalVol  : prev2.maxKg;
        const diff = latV - preV;
        const pct  = preV > 0 ? (diff / preV * 100) : 0;
        const sign = diff > 0 ? '+' : '';
        if (diff > 0)      deltaBadge = `<span class="prog-delta-badge up">▲ ${sign}${useVol ? Math.round(diff) : diff.toFixed(1)} ${useVol?'kg':'kg'} (${sign}${pct.toFixed(0)}%)</span>`;
        else if (diff < 0) deltaBadge = `<span class="prog-delta-badge down">▼ ${useVol ? Math.round(diff) : diff.toFixed(1)} kg (${pct.toFixed(0)}%)</span>`;
        else               deltaBadge = `<span class="prog-delta-badge eq">→ Değişim yok</span>`;
      }

      const bars = last8.map((h, i) => {
        const v = useVol ? h.totalVol : h.maxKg;
        const hPx = Math.max(Math.round(v / maxVal * 72), 3);
        const isCur = i === last8.length - 1;
        const d = parseDate(h.date);
        const lbl = `${pad(d.getDate())}/${pad(d.getMonth()+1)}`;
        const dispVal = useVol ? Math.round(v)+'kg' : v+'kg';
        return `<div class="vol-bar-col">
          <div style="position:relative;width:100%;height:72px;display:flex;align-items:flex-end;">
            <div class="vol-bar ${isCur?'cur':'past'}" style="height:${hPx}px;width:100%;">
              ${isCur ? `<span class="vol-top-val">${dispVal}</span>` : ''}
            </div>
          </div>
          <div class="vol-bar-lbl">${lbl}</div>
        </div>`;
      }).join('');

      const histRows = hist.slice(-10).reverse().map(h => {
        const sStr = h.sets.filter(s => s.kg !== '' && s.kg !== undefined)
          .map(s => `${s.kg}×${s.reps}${s.rpe ? '@'+s.rpe : ''}`).join(' · ');
        const vol = h.sets.reduce((a,s) => a + (parseFloat(s.kg)||0)*(parseFloat(s.reps)||0), 0);
        const d = parseDate(h.date);
        return `<div class="prog-history-row">
          <span style="min-width:52px;color:var(--text2);font-size:11px;">${pad(d.getDate())}/${pad(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}</span>
          <span style="flex:1;color:var(--text);font-size:12px;">${sStr}</span>
          <span style="color:var(--accent);font-size:11px;font-weight:700;white-space:nowrap;">${Math.round(vol)} kg</span>
        </div>`;
      }).join('');

      html += `<div class="prog-ex-card">
        <div class="vol-summary">
          <div class="prog-ex-name">${ex.name}</div>
          ${deltaBadge}
        </div>
        <div class="vol-chart-wrap">${bars}</div>
        <details style="font-size:12px;margin-top:4px;">
          <summary>Seans detayları<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></summary>
          <div style="margin-top:8px;">${histRows}</div>
        </details>
      </div>`;
    });
  });

  content.innerHTML = html;
}

function renderRecords(exHistory) {
  const typeOf = {}, nameOf = {};
  PROGRAM.filter(p => progFilter === 'all' || p.type === progFilter).forEach(p => flatEx(p).forEach(ex => {
    if (!(ex.id in nameOf)) { nameOf[ex.id] = ex.name; typeOf[ex.id] = p.type; }
  }));
  if (progFilter === 'all') Object.keys(exHistory).forEach(id => { if (!(id in nameOf)) { nameOf[id] = exName(id); typeOf[id] = 'rest'; } });
  const rows = [];
  Object.keys(nameOf).forEach(id => {
    const hist = exHistory[id]; if (!hist) return;
    let best = null;
    hist.forEach(h => h.sets.forEach(s => {
      const kg = parseFloat(s.kg), r = parseFloat(s.reps);
      if (!(kg > 0 && r > 0)) return;
      const e1 = kg * (1 + r / 30);
      if (!best || e1 > best.e1 + 1e-9) best = { e1, kg, reps: r, date: h.date };
    }));
    if (best) rows.push({ id, best, isNew: hist.length > 1 && best.date === hist[hist.length - 1].date });
  });
  if (!rows.length) return `<div class="empty-state"><div class="empty-text">Bu filtrede henüz kayıt yok.</div></div>`;
  rows.sort((a, b) => b.best.date.localeCompare(a.best.date) || b.best.e1 - a.best.e1);
  const num = n => String(Math.round(n * 10) / 10);
  return `<div class="rec-note">Tahmini tek tekrar maksimumun (1RM). En yeni rekor en üstte.</div>
  <div class="rec-card">${rows.map(r => `
    <div class="rec-row t-${typeOf[r.id]}">
      <i class="plate" style="--s:22px"></i>
      <div class="rec-main">
        <div class="rec-name">${nameOf[r.id]}</div>
        <div class="rec-sub">${num(r.best.kg)} kg × ${num(r.best.reps)} · ${fmtShort(r.best.date)}</div>
      </div>
      <div class="rec-right">${r.isNew ? '<div class="rec-new">Yeni</div>' : ''}<div class="rec-val">${num(r.best.e1)}<small>kg</small></div></div>
    </div>`).join('')}</div>`;
}

function setProgFilter(f) { progFilter = f; renderProgress(); }
function setProgTab(t) { progTab = t; muscleWeekOffset = 0; renderProgress(); }

// ═══════════════════════════════════════════════
// MUSCLE MAP
// ═══════════════════════════════════════════════
let muscleWeekOffset = 0; // 0 = bu hafta, -1 = geçen hafta vb.

// Kas grubu → egzersiz ID eşleştirmesi
const MUSCLE_MAP = {
  chest_upper: { label:'Üst Göğüs',   exIds:['incline_press','incline_db_press'], color:'#E8523D' },
  chest_lower: { label:'Alt/İç Göğüs',exIds:['chest_press_mid','chest_press_lower','pec_deck_fly','flat_db_press'], color:'#E8523D' },
  front_delt:  { label:'Ön Omuz',     exIds:['seated_db_shoulder','incline_shoulder_machine'], color:'#E8523D' },
  side_delt:   { label:'Yan Omuz',    exIds:['cable_lateral_a','db_lateral','seated_db_lateral'], color:'#E8523D' },
  rear_delt:   { label:'Arka Omuz',   exIds:['rev_pec_deck','face_pull'], color:'#4F88F2' },
  triceps:     { label:'Triceps',     exIds:['triceps_rope','overhead_cable_tri','bar_pushdown','single_cable_pushdown','cable_pushdown'], color:'#E8523D' },
  lat:         { label:'Kanat (Lat)', exIds:['neutral_pulldown','wide_pulldown'], color:'#4F88F2' },
  mid_back:    { label:'Orta Sırt',   exIds:['cable_row_v','single_arm_row','chest_row_machine','wide_cable_row'], color:'#4F88F2' },
  biceps:      { label:'Biceps',      exIds:['zbar_curl','hammer_curl','incline_db_curl','biceps_curl'], color:'#4F88F2' },
  forearm:     { label:'Ön Kol',      exIds:['reverse_zbar'], color:'#4F88F2' },
  quad:        { label:'Quadriceps',  exIds:['leg_press','leg_extension','smith_squat','bulgarian_split_squat'], color:'#2FB872' },
  hamstring:   { label:'Hamstring',   exIds:['seated_leg_curl','lying_leg_curl','rdl','deadlift','trap_bar_deadlift'], color:'#2FB872' },
  glute:       { label:'Kalça',       exIds:['hip_thrust'], color:'#2FB872' },
  adductor:    { label:'İç Bacak',    exIds:['hip_adduction'], color:'#2FB872' },
  calf:        { label:'Baldır',      exIds:['calf_raise','calf_abs'], color:'#2FB872' },
};

function muscleOf(id) {
  const o = db.exMuscle && db.exMuscle[id];
  if (o !== undefined) return o === 'none' ? null : o;
  for (const m in MUSCLE_MAP) if (MUSCLE_MAP[m].exIds.includes(id)) return m;
  return null;
}

function getWeekRange(offset) {
  const now = new Date();
  const day = now.getDay(); // 0=Sun
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((day + 6) % 7) + offset * 7);
  monday.setHours(0,0,0,0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  sunday.setHours(23,59,59,999);
  return { start: dateStr(monday), end: dateStr(sunday) };
}

function getMuscleVolumes(offset) {
  const { start, end } = getWeekRange(offset);
  const vols = {};
  Object.keys(MUSCLE_MAP).forEach(m => vols[m] = 0);

  Object.keys(db.workouts).forEach(ds => {
    if (ds < start || ds > end) return;
    const w = db.workouts[ds]; if (!w.sets) return;
    Object.keys(w.sets).forEach(exId => {
      const muscleId = muscleOf(exId);
      if (!muscleId || !(muscleId in vols)) return;
      (w.sets[exId] || []).forEach(s => {
        vols[muscleId] += (parseFloat(s.kg)||0) * (parseFloat(s.reps)||0);
      });
    });
  });
  return vols;
}

// Renk: 0→koyu, max→parlak accent
function muscleColor(vol, maxVol, baseColor) {
  if (vol === 0) return '#1E1E2E'; // çalışılmadı
  const pct = Math.min(vol / maxVol, 1);
  // opacity ile değil, rengin alpha kanalıyla
  const hex = baseColor.replace('#','');
  const r = parseInt(hex.slice(0,2),16);
  const g = parseInt(hex.slice(2,4),16);
  const b = parseInt(hex.slice(4,6),16);
  const a = 0.2 + pct * 0.8;
  return `rgba(${r},${g},${b},${a})`;
}

function muscleWeekNav(dir) {
  muscleWeekOffset = Math.min(muscleWeekOffset + dir, 0);
  renderProgress();
}

function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = `gymtracker_${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);
  showToast('Yedek indirildi ✓');
}

function handleImport(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const imp = JSON.parse(ev.target.result);
      if (!imp.workouts) throw new Error();
      db = imp; normalizeDB(); saveDB(); renderSettings(); renderToday();
      showToast('Veriler yüklendi ✓');
    } catch { showToast('Hata: Geçersiz dosya'); }
  };
  r.readAsText(f); e.target.value = '';
}

function clearAllModal() {
  showModal(`
    <div class="modal-title" style="color:var(--red)">Tüm Verileri Sil</div>
    <p style="color:var(--text2);font-size:14px;margin-bottom:16px;">Tüm antrenman geçmişin silinecek. Önce yedek almayı unutma!</p>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeModal()">İptal</button>
      <button class="btn btn-danger" onclick="clearAll()">Evet, Sil</button>
    </div>`);
}

function clearAll() {
  db = { workouts: {} }; normalizeDB(); saveDB(); closeModal(); renderSettings(); renderToday();
  showToast('Tüm veriler silindi');
}

// ═══════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════
let _toastT;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

// ═══════════════════════════════════════════════
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

// ═══════════════════════════════════════════════
// YENİ GÜN — uygulama açık kalsa bile "Bugün" güncellensin
// ═══════════════════════════════════════════════
let _todayShown = todayStr();
function checkNewDay() {
  const now = todayStr();
  if (now === _todayShown) return;
  const old = _todayShown; _todayShown = now;
  const w = db.workouts[old];
  const inProgress = !!w && !w.completed &&
    Object.values(w.sets || {}).some(sets => sets.some(r => r.kg !== '' && r.kg !== undefined));
  // Başka bir güne bakıyorsa ya da yarım kalmış bir seansın varsa ekranı elinden alma;
  // sadece "Bugün" etiketi doğru görünsün.
  if (viewDate !== old || inProgress) { renderToday(); return; }
  viewDate = now; selectedProgIdx = null; window._plateRoll = true;
  renderToday();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkNewDay(); });
window.addEventListener('pageshow', checkNewDay);
setInterval(checkNewDay, 60000);

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
loadDB();
renderToday();
</script>
